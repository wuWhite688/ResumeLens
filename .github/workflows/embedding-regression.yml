name: Real embedding regression

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 1"
  pull_request:
    paths:
      - "jd-rag-resume-backend/pom.xml"
      - "jd-rag-resume-backend/src/main/java/com/arthur/jdragresume/rag/**"
      - "jd-rag-resume-backend/src/main/resources/application.properties"
      - "jd-rag-resume-backend/src/test/java/com/arthur/jdragresume/rag/**"
      - ".github/workflows/embedding-regression.yml"
  push:
    branches: [main]
    paths:
      - "jd-rag-resume-backend/pom.xml"
      - "jd-rag-resume-backend/src/main/java/com/arthur/jdragresume/rag/**"
      - "jd-rag-resume-backend/src/main/resources/application.properties"
      - "jd-rag-resume-backend/src/test/java/com/arthur/jdragresume/rag/**"
      - ".github/workflows/embedding-regression.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embedding-regression:
    name: 真实 ONNX embedding 回归 · Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 下载并校验固定版本模型
        env:
          MODEL_REVISION: 2edbf5e672aab465f9ed4c154a8b61791c082c69
          TOKENIZER_SHA256: 3a56def25aa40facc030ea8b0b87f3688e4b3c39eb8b45d5702b3a1300fe2a20
          MODEL_SHA256: ab2bd164ebd8ca9003dc49a981b611e849b5d326f504c8873ba76e07fa6c0082
        run: |
          set -euo pipefail
          model_dir="${RUNNER_TEMP}/gte-multilingual-base-int8"
          mkdir -p "$model_dir"
          curl --fail --location --retry 3 --output "$model_dir/tokenizer.json" \
            "https://huggingface.co/onnx-community/gte-multilingual-base/resolve/${MODEL_REVISION}/tokenizer.json"
          curl --fail --location --retry 3 --output "$model_dir/model_int8.onnx" \
            "https://huggingface.co/onnx-community/gte-multilingual-base/resolve/${MODEL_REVISION}/onnx/model_int8.onnx"
          echo "${TOKENIZER_SHA256}  $model_dir/tokenizer.json" | sha256sum --check --strict
          echo "${MODEL_SHA256}  $model_dir/model_int8.onnx" | sha256sum --check --strict

      - name: 运行真实 embedding 回归
        working-directory: jd-rag-resume-backend
        env:
          RUN_EMBEDDING_REGRESSION: "true"
          RAG_EMBEDDING_TOKENIZER_URI: file:${{ runner.temp }}/gte-multilingual-base-int8/tokenizer.json
          RAG_EMBEDDING_MODEL_URI: file:${{ runner.temp }}/gte-multilingual-base-int8/model_int8.onnx
        run: ./mvnw -B --no-transfer-progress -Dtest=RealEmbeddingRegressionTests test

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-embedding-surefire-report
          path: jd-rag-resume-backend/target/surefire-reports/
          retention-days: 7
