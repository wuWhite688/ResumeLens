name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Temporary write permission is used only to repair this PR's cross-platform
# npm lockfile. This helper will be reverted after the corrected lockfile is
# committed back to the PR branch.
permissions:
  contents: write

# 同一分支上新的推送会取消仍在排队的旧运行，避免浪费 runner 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · Java 21
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # GitHub 托管的 ubuntu runner 自带 Docker，因此 Testcontainers 用例
      # （ResumeDeleteCascadeMySqlTests，真起 mysql:9.7.0 验证外键级联删除）
      # 会在这里真实执行。开发者本机 Windows 的 PATH 里没有 docker 命令，
      # 这两条用例只会被静默跳过 —— CI 是它们唯一稳定跑到的地方。
      - name: 构建与测试
        working-directory: jd-rag-resume-backend
        run: ./mvnw -B --no-transfer-progress verify

      # 失败时同样上传，否则排查 CI 红灯只能靠日志里被截断的堆栈
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: jd-rag-resume-backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: 前端 · Node 22
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # package.json 的 engines 要求 >=22.13.0；测试脚本用到
      # node --experimental-strip-types 直接执行 .ts 测试文件
      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jd-rag-resume-frontend/package-lock.json

      # The lockfile was generated on Windows and missed two nested optional
      # wasm dependencies required by Rolldown on a clean Linux install.
      # Re-resolve package-lock only (no node_modules install yet), commit the
      # corrected lock back to this same-repository PR branch, then verify with
      # the normal strict npm ci step below.
      - name: 修复跨平台 lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: jd-rag-resume-frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: 提交修复后的 lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- jd-rag-resume-frontend/package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jd-rag-resume-frontend/package-lock.json
          git commit -m "chore: sync frontend package lock"
          git push origin HEAD:${{ github.head_ref }}

      - name: 安装依赖
        working-directory: jd-rag-resume-frontend
        run: npm ci

      - name: 代码规范检查
        working-directory: jd-rag-resume-frontend
        run: npm run lint

      # npm test 内部串联了 vinext build，构建失败会一并暴露
      - name: 测试（含生产构建）
        working-directory: jd-rag-resume-frontend
        run: npm test
