spring.application.name=jd-rag-resume-backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/jd_rag_resume?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:jd_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Existing Hibernate-created databases are recorded as version 1 without changing their data.
# Empty databases execute V1__initial_schema.sql normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing Hibernate schema

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.jackson.time-zone=Asia/Shanghai
spring.jackson.default-property-inclusion=non_null

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
app.jwt.refresh-expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:7}
app.jwt.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

app.upload.resume-dir=uploads/resumes

ai.api-key=${AI_API_KEY:}
ai.base-url=${AI_BASE_URL:}
ai.model=${AI_MODEL:}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}
ai.mock-enabled=${AI_MOCK_ENABLED:false}

app.analysis.pending-timeout-minutes=${ANALYSIS_PENDING_TIMEOUT_MINUTES:10}
app.analysis.recovery-interval-ms=${ANALYSIS_RECOVERY_INTERVAL_MS:60000}

app.rag.chunk-size=${RAG_CHUNK_SIZE:900}
app.rag.chunk-overlap=${RAG_CHUNK_OVERLAP:120}
app.rag.top-k=${RAG_TOP_K:5}
app.rag.max-chunks=${RAG_MAX_CHUNKS:80}
app.rag.embedding-batch-size=${RAG_EMBEDDING_BATCH_SIZE:8}
app.rag.min-similarity=${RAG_MIN_SIMILARITY:0.72}
app.rag.hybrid-enabled=${RAG_HYBRID_ENABLED:true}
app.rag.keyword-boost=${RAG_KEYWORD_BOOST:0.035}
app.rag.max-keyword-boosts=${RAG_MAX_KEYWORD_BOOSTS:3}
app.rag.dual-query-enabled=${RAG_DUAL_QUERY_ENABLED:true}
app.rag.max-length=${RAG_MAX_LENGTH:8192}
app.rag.embedding-dimensions=${RAG_EMBEDDING_DIMENSIONS:768}
# token_embeddings == last_hidden_state in the onnx-community export; pooling is CLS (first token).
app.rag.model-output-name=${RAG_MODEL_OUTPUT_NAME:token_embeddings}
app.rag.pooling-mode=${RAG_POOLING_MODE:cls}
app.rag.embedding-model-id=${RAG_EMBEDDING_MODEL_ID:Alibaba-NLP/gte-multilingual-base-int8}
app.rag.embedding-tokenizer-uri=${RAG_EMBEDDING_TOKENIZER_URI:https://huggingface.co/onnx-community/gte-multilingual-base/resolve/main/tokenizer.json}
app.rag.embedding-model-uri=${RAG_EMBEDDING_MODEL_URI:https://huggingface.co/onnx-community/gte-multilingual-base/resolve/main/onnx/model_int8.onnx}
app.rag.query-prefix=${RAG_QUERY_PREFIX:Represent this sentence for searching relevant passages:}
app.rag.lucene-index-dir=${RAG_LUCENE_INDEX_DIR:data/lucene/resume-vectors}
